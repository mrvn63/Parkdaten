name: Parkdaten sammeln

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub kann sich um einige Minuten verspäten)
  workflow_dispatch:          # erlaubt einen manuellen Testlauf über den Knopf "Run workflow"

permissions:
  contents: write             # nötig, damit die Daten ins Repository gespeichert werden dürfen

concurrency:
  group: parkdaten
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten abrufen
        run: python collect.py

      - name: Daten speichern
        run: |
          git config user.name "parkdaten-bot"
          git config user.email "parkdaten-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
            exit 0
          fi
          git commit -m "Daten $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
